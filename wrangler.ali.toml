# ═══════════════════════════════════════════════════════════════
#  Omni Panel — Cloudflare Worker (omni-ali)
# ═══════════════════════════════════════════════════════════════
name = "omni-ali"
main = "production/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "omni-db"
database_id = "dbf2efd0-d35f-42ad-8fbe-f09806ba8644"

[vars]
PANEL_NAME = "Omni"
BOT_WEBHOOK_SECRET = "omni-hook"
BOT_USERNAME = "OmniAiGateBot"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "RELEASES"
id = "ec47b341007747f1a9d4d94c5855c35a"
