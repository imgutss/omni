# ═══════════════════════════════════════════════════════════════
#  Omni Panel — Cloudflare Worker (omni-ali)
# ═══════════════════════════════════════════════════════════════
name = "omni-nova-f61e"
main = "production/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "omni-nova-f61e-db-6e0947"
database_id = "0e0fe2b6-0ba1-4eb2-a6d4-845628372fce"

[vars]
PANEL_NAME = "Omni"
BOT_WEBHOOK_SECRET = "omni-hook"
BOT_USERNAME = "OmniAiGateBot"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "RELEASES"
id = "ec47b341007747f1a9d4d94c5855c35a"
