name = "omni"
main = "production/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "omni-db"
database_id = "9660e603-a4e9-4b2c-8071-788e2539e618"

[vars]
PANEL_NAME = "Omni"
BOT_WEBHOOK_SECRET = "omni-hook"
BOT_USERNAME = "OmniAiGateBot"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "RELEASES"
id = "f7ac482df0f04daf96378b6b55224dc9"
