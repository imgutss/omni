  function omniStun(host, ms) {
    return new Promise((resolve) => {
      let done = false, pc = null, t0 = performance.now(), v6host = false;
      const finish = (ok, info) => {
        if (done) return;
        done = true;
        try { pc && pc.close(); } catch {}
        resolve(Object.assign({ ok, ms: Math.round(performance.now() - t0), v6host }, info || {}));
      };
      try {
        pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:" + host }] });
        pc.createDataChannel("omni");
        pc.onicecandidate = (ev) => {
          const c = ev.candidate;
          if (!c) return;
          const addr = String(c.address || "");
          if (addr.indexOf(":") >= 0) v6host = true;
          if (c.type === "srflx" || c.type === "relay") finish(true, { ip: addr, fam: addr.indexOf(":") >= 0 ? 6 : 4 });
        };
        pc.onicecandidateerror = () => {};
        pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(() => finish(false));
      } catch { finish(false); }
      setTimeout(() => finish(false), ms || 5000);
    });
  }

  async function omniRttSamples(url, n) {
    const out = [];
    for (let i = 0; i < (n || 3); i++) {
      const t0 = performance.now();
      try {
        await fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "omni=" + Date.now() + "-" + i, { mode: "no-cors", cache: "no-store", credentials: "omit" });
        out.push(Math.round(performance.now() - t0));
      } catch { out.push(-1); }
    }
    return out;
  }

  async function omniCollectFacts() {
    const f = { at: new Date().toISOString(), net: {} };
    try {
      const r = await fetch("/api/gaming/net-probe?ts=" + Date.now(), { credentials: "same-origin", cache: "no-store" });
      const j = await r.json();
      if (j && j.ok) {
        f.net.operator = j.org || "";
        f.net.asn = j.asn || 0;
        f.net.colo = j.colo || "";
        f.net.country = j.country || "";
        f.net.tcpRtt = typeof j.tcpRtt === "number" ? j.tcpRtt : null;
        f.net.http = j.protocol || "";
        f.net.tls = j.tls || "";
        f.net.ip = j.ip || "";
      }
    } catch (err) { f.net.err = String((err && err.message) || err).slice(0, 80); }

    const a = await omniStun("stun.cloudflare.com:3478", 5000);
    f.udp = !!a.ok;
    f.udpRtt = a.ok ? a.ms : null;
    f.pubIp = a.ip || f.net.ip || "";
    f.ipv6 = !!(a.v6host || a.fam === 6);

    const samples = await omniRttSamples("https://1.1.1.1/cdn-cgi/trace", 3);
    const good = samples.filter((x) => x > 0).sort((x, y) => x - y);
    f.tlsRtt = good.length ? good[0] : null;
    f.samples = samples;
    return f;
  }

  function omniRank(f) {
    if (!f || f.udp === false) return [];
    const rows = omniVerifiedLib().filter((x) => (x.fam === 6 ? f.ipv6 === true : true));
    rows.sort((a, b) => {
      const sa = a.src === "user" ? 0 : 1, sb = b.src === "user" ? 0 : 1;
      if (sa !== sb) return sa - sb;
      return (a.rtt || 9) - (b.rtt || 9);
    });
    const seen = new Set();
    return rows.filter((x) => (seen.has(x.ep) ? false : (seen.add(x.ep), true))).slice(0, 6);
  }

  async function omniSaveEndpoint(ep) {
    ep = String(ep || "").trim();
    if (!omniEpOk(ep)) throw Error("اندپوینت معتبر نیست (مثال: 162.159.192.1:2408)");
    const cur = parseWarpGamingAccount(typeof l !== "undefined" && l ? l.settings : {});
    const updated = Object.assign({}, cur, { customEndpoint: ep });
    GAMING_VIEW_STATE.customEndpoint = ep;
    GAMING_VIEW_STATE.selectedEndpoint = ep;
    GAMING_VIEW_STATE.warpAccount = updated;
    if (typeof l !== "undefined" && l && l.settings) l.settings.warp_gaming_account = JSON.stringify(updated);
    let serverSaved = true;
    try {
      const saved = await b.saveSettings({ warp_gaming_account: JSON.stringify(updated) });
      if (saved && saved.settings && typeof l !== "undefined" && l) l.settings = saved.settings;
    } catch { serverSaved = false; }
    omniG48Save();
    if (!serverSaved) y("⚠️ اندپوینت فعال شد ولی ذخیرهٔ سروری نشد؛ اگر صفحه را رفرش کنی ممکن است برگردد — دوباره بزن", "warn", 5000);
    return ep;
  }

  async function omniRunScan(e, btn) {

    omniScanLine(

            : "✕ UDP بسته یا فیلتر است (STUN بی‌پاسخ ماند) — وایرگارد روی این شبکه وصل نمی‌شود",

    );
    omniScanLine(f.tlsRtt ? `✔ RTT تا لبهٔ کلادفلر از گوشی: ${a(f.tlsRtt)}ms` : "• سنجش RTT به کلادفلر ناموفق بود", f.tlsRtt ? "ok" : "warn");
    omniScanLine(f.ipv6 ? "✔ این شبکه IPv6 دارد" : "• IPv6 روی این شبکه دیده نشد (فقط IPv4)", f.ipv6 ? "ok" : "");

    const picks = omniRank(f);

    GAMING_VIEW_STATE.scan = f;

    if (f.udp === false) {

    } else {
      omniScanLine(`✔ ${a(picks.length)} اندپوینت مناسب پیدا شد؛ انتخاب خودکار: <b dir="ltr">${a(picks[0].ep)}</b>`, "ok");

        : "سنجش تمام شد · " + picks.length + " اندپوینت پیشنهادی",

  }

  var omniWarpKeyPromise = null;

  async function omniHydrateSnapshot() {

      const j = await r.json();
      const snap = j && j.ok ? j.snapshot : null;
      if (!snap || !Array.isArray(snap.items)) return;
      const at = snap.at || "";
      if (!at || Date.parse(at) <= Date.parse(OMNI_EP_PROBE_AT)) return;
      const map = {};
      snap.items.forEach((it) => { if (it && it.ok && it.ep) map[it.ep] = it; });
      OMNI_EP_LIB.forEach((x) => {

    } catch {}

  function omniActiveEndpoint(st) {

  function buildWireguardUris(st) {
    const acc = parseWarpGamingAccount(st);
    if (!acc || !acc.privateKey) return [];
    const resStr = Array.isArray(acc.reserved) ? acc.reserved.join(",") : "157,13,43";
    const addrParam = `${acc.v4 || "172.16.0.2"}/32,${acc.v6 || "2606:4700:110:8c7a:a6bb:348e:8e1d:a2b7"}/128`;
    const rows = omniVerifiedLib().slice();
    const active = omniActiveEndpoint(st);
    if (!rows.some((x) => x.ep === active)) rows.unshift({ ep: active, fam: omniEpFam(active), src: "user" });
    return rows.map((row) => {
      const { host, port } = omniEpHostPort(row.ep);
      const hostBracket = host.indexOf(":") >= 0 ? `[${host}]` : host;
      const q = new URLSearchParams({
        publickey: acc.peerPublicKey || "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=",
        address: addrParam,
        mtu: String(acc.mtu || 1280),
        reserved: resStr,
        dns: "1.1.1.1,1.0.0.1"
      });

      const title = `🎮 WireGuard Game · ${row.ep} · ${tag}`;
      return {
        title,
        addr: host,
        port,
        proto: "WireGuard-UDP",
        uri: `wireguard://${encodeURIComponent(acc.privateKey)}@${hostBracket}:${port}?${q.toString()}#${encodeURIComponent(title)}`
      };
    });
  }
