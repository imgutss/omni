name: android-ci

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;34.0.0" >/dev/null || true

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK (ephemeral CI key)
        run: |
          KS="$RUNNER_TEMP/omni-ci.jks"
          keytool -genkeypair -v -keystore "$KS" -alias omni \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass omni-ci-pass -keypass omni-ci-pass \
            -dname "CN=Omni, OU=Omni, O=Omni, L=Net, ST=Net, C=IR" >/dev/null 2>&1
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          "$APKSIGNER" sign --ks "$KS" --ks-pass pass:omni-ci-pass \
            --key-pass pass:omni-ci-pass \
            --out omni-v0.1.0.apk "$UNSIGNED"
          "$APKSIGNER" verify omni-v0.1.0.apk && echo "APK SIGNED + VERIFIED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-apk
          path: android/omni-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
