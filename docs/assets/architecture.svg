<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc"><title id="title">Omni architecture</title><desc id="desc">Web and Telegram reach a shared Worker control plane, backed by D1, KV and Durable Objects. Compatible VPN clients use the transport engine and optional external relays.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#60caba"/></marker></defs><rect width="1280" height="540" rx="24" fill="#091522"/><text x="42" y="53" fill="#a5bfce" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">SHARED STATE. CLEAR BOUNDARIES.</text><rect x="42" y="100" width="250" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="62" y="135" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Web dashboard</text><text x="62" y="161" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">HTTPS / session</text><rect x="42" y="226" width="250" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="62" y="261" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Telegram console</text><text x="62" y="287" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Private path + secret header</text><rect x="42" y="390" width="250" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="62" y="425" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">VPN client</text><text x="62" y="451" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Compatible profile / transport</text><rect x="424" y="160" width="354" height="135" rx="16" fill="#102436" stroke="#4f9b95"/><text x="444" y="195" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">WORKER</text><text x="444" y="221" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">API · auth · jobs · subscriptions</text><text x="444" y="267" fill="#61dac8" font-family="Arial,sans-serif" font-size="13">Transport and egress engine</text><rect x="930" y="100" width="308" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="950" y="135" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">D1 database</text><text x="950" y="161" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Users · accounts · jobs · settings</text><rect x="930" y="226" width="308" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="950" y="261" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">KV / RELEASES</text><text x="950" y="287" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Auxiliary state · release bundle</text><rect x="930" y="352" width="308" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="950" y="387" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Durable Objects</text><text x="950" y="413" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Egress coordination</text><rect x="424" y="390" width="354" height="88" rx="16" fill="#102436" stroke="#255364"/><text x="444" y="425" fill="#e0eff7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Optional provider relays</text><text x="444" y="451" fill="#92acbd" font-family="Arial,sans-serif" font-size="13">Separate accounts and infrastructure</text><path d="M292 144H356V204H418" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 270H356V250H418" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M292 434H356V278H418" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M778 197H850V144H924" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M778 229H924" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M778 263H850V396H924" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 295V384" fill="none" stroke="#60caba" stroke-width="2" marker-end="url(#arrow)"/><text x="930" y="489" fill="#7896a9" font-family="Arial,sans-serif" font-size="12">Placement is not proof of exit country.</text></svg>
