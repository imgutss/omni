<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Omni Panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset=".55" stop-color="#080d18"/><stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb03a"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ef0b5"/><stop offset="1" stop-color="#22c9a0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8a1e" stop-opacity=".38"/><stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ee6a8" stop-opacity=".30"/><stop offset="1" stop-color="#2ee6a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fb0ff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="200" cy="120" rx="320" ry="200" fill="url(#glow)"/>
  <ellipse cx="1100" cy="330" rx="340" ry="220" fill="url(#glow2)"/>

  <!-- orbit rings -->
  <g opacity=".55" fill="none">
    <ellipse cx="640" cy="212" rx="430" ry="128" stroke="url(#amber)" stroke-opacity=".28" stroke-width="1.2"/>
    <ellipse cx="640" cy="212" rx="330" ry="96" stroke="#8fd8ff" stroke-opacity=".16" stroke-width="1"/>
    <ellipse cx="640" cy="212" rx="540" ry="160" stroke="#ff9b3d" stroke-opacity=".12" stroke-width="1"/>
  </g>

  <!-- core mark -->
  <g transform="translate(640 196)">
    <circle r="96" fill="url(#glow)" filter="url(#soft)"/>
    <g fill="none" stroke="url(#amber)" stroke-width="3.4" stroke-linecap="round">
      <path d="M-52 -30 L0 -60 L52 -30 L52 30 L0 60 L-52 30 Z" stroke-opacity=".95"/>
      <path d="M-52 -30 L0 0 L52 -30 M0 0 L0 60" stroke-opacity=".55" stroke-width="2.2"/>
    </g>
    <circle r="15" fill="url(#mint)" opacity=".95"/>
    <circle r="15" fill="none" stroke="#0b1220" stroke-width="3"/>
  </g>

  <!-- satellites -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#9fc4e8">
    <g>
      <rect x="150" y="128" width="150" height="52" rx="14" fill="url(#glass)" stroke="#ffb03a" stroke-opacity=".45"/>
      <text x="225" y="151" text-anchor="middle" fill="#ffc46b">Panel UI</text>
      <text x="225" y="168" text-anchor="middle" fill="#7f9ab5" font-size="10">1.34 MB · inline</text>
      <line x1="300" y1="154" x2="440" y2="180" stroke="url(#amber)" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
    <g>
      <rect x="978" y="112" width="160" height="52" rx="14" fill="url(#glass)" stroke="#4ef0b5" stroke-opacity=".45"/>
      <text x="1058" y="135" text-anchor="middle" fill="#6ff0c2">Telegram</text>
      <text x="1058" y="152" text-anchor="middle" fill="#7f9ab5" font-size="10">webhook · 0 pending</text>
      <line x1="978" y1="150" x2="840" y2="178" stroke="url(#mint)" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
    <g>
      <rect x="128" y="286" width="168" height="52" rx="14" fill="url(#glass)" stroke="#8fd8ff" stroke-opacity=".4"/>
      <text x="212" y="309" text-anchor="middle" fill="#9fd8ff">Durable Object</text>
      <text x="212" y="326" text-anchor="middle" fill="#7f9ab5" font-size="10">OmniEgress2 · SQLite</text>
      <line x1="296" y1="300" x2="470" y2="242" stroke="#8fd8ff" stroke-opacity=".25" stroke-dasharray="4 5"/>
    </g>
    <g>
      <rect x="982" y="278" width="176" height="52" rx="14" fill="url(#glass)" stroke="#c9a2ff" stroke-opacity=".4"/>
      <text x="1070" y="301" text-anchor="middle" fill="#d6b8ff">D1 · KV</text>
      <text x="1070" y="318" text-anchor="middle" fill="#7f9ab5" font-size="10">state · releases</text>
      <line x1="982" y1="298" x2="820" y2="240" stroke="#c9a2ff" stroke-opacity=".22" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="640" y="356" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="46" font-weight="800" fill="#f4f8ff" letter-spacing="6">OMNI</text>
  <text x="640" y="384" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#7f9ab5" letter-spacing="3.6">CLOUDFLARE NATIVE · SELF-HOSTED · ONE WORKER</text>
</svg>
